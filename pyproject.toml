[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autohaus-ai-rag-agent-backend"
version = "0.2.0"
description = "Privacy-aware FastAPI RAG backend for automotive dealership AI workflows — hybrid RRF retrieval, Claude synthesis, streaming SSE, multi-turn history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "jinja2>=3.1.0,<4.0.0",
  "pydantic-settings>=2.2.1,<3.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
ai = [
  "openai>=1.30.0,<2.0.0",
  "anthropic>=0.40.0,<1.0.0",
]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

